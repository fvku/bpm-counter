<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Polyrhythm Reference</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #080808;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      touch-action: manipulation;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Top bar ── */
    .top-bar {
      width: 100%;
      flex-shrink: 0;
      height: 40px;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .page-title {
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      color: #555;
      text-transform: uppercase;
    }

    .back-link {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      color: #555;
      text-decoration: none;
      text-transform: uppercase;
      transition: color 0.15s;
    }

    .back-link:hover { color: #bbb; }

    /* ── Scrollable table area ── */
    .table-wrap {
      flex: 1;
      width: 100%;
      max-width: 520px;
      overflow-y: auto;
      overflow-x: auto;
      padding: 0 16px;
    }

    .table-wrap::-webkit-scrollbar { width: 3px; }
    .table-wrap::-webkit-scrollbar-track { background: transparent; }
    .table-wrap::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }

    /* ── Table ── */
    table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
    }

    thead th {
      position: sticky;
      top: 0;
      text-align: right;
      font-size: 0.6rem;
      letter-spacing: 0.06em;
      color: #666;
      padding: 10px 10px;
      border-bottom: 1px solid #222;
      background: #080808;
      text-transform: uppercase;
    }

    thead th:first-child { text-align: left; }

    tbody td {
      text-align: right;
      font-size: 0.9rem;
      padding: 7px 10px;
      color: #777;
      border-bottom: 1px solid #111;
    }

    tbody td:first-child {
      color: #ccc;
      font-weight: 700;
      font-size: 0.95rem;
    }

    tbody tr.anchor td { background: #0e0e0e; color: #999; }
    tbody tr.anchor td:first-child { color: #fff; }
  </style>
</head>
<body>
  <div class="top-bar">
    <span class="page-title">Polyrhythm Reference</span>
    <a class="back-link" href="index.html">← BPM</a>
  </div>

  <div class="table-wrap" id="tableWrap">
    <table>
      <thead>
        <tr>
          <th>BPM</th>
          <th>×3/2<br>2拍三連</th>
          <th>×4/3<br>4:3</th>
          <th>×2/3<br>逆三連</th>
          <th>×3/4<br>逆4:3</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div style="height: 48px"></div>
  </div>

  <script>
    const ANCHORS = new Set([70, 80, 90, 100, 110, 120, 128, 130, 140, 150, 160, 170, 180, 190, 200]);
    const ratios = [3/2, 4/3, 2/3, 3/4];
    const tbody = document.getElementById('tbody');
    let html = '';
    for (let bpm = 60; bpm <= 200; bpm++) {
      const cls = ANCHORS.has(bpm) ? ' class="anchor"' : '';
      html += `<tr${cls} data-bpm="${bpm}"><td>${bpm}</td>${ratios.map(r => `<td>${(bpm * r).toFixed(1)}</td>`).join('')}</tr>`;
    }
    tbody.innerHTML = html;

    // Scroll to BPM 100 (below thead)
    const wrap = document.getElementById('tableWrap');
    const row100 = tbody.querySelector('tr[data-bpm="100"]');
    const theadH = document.querySelector('thead').offsetHeight;
    wrap.scrollTop = row100.offsetTop - theadH;
  </script>
</body>
</html>
